<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-labelledby="t d">
<title id="t">0xPunisher</title>
<desc id="d">Builder and bot developer. Top 0.1% among arbitrage bots on Polymarket. Creator of CrawlScan.</desc>
<defs>
<style>@font-face{font-family:'PX Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'PX Mono';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'PX Display';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'PX Text';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}
.mono{font-family:'PX Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
.display{font-family:'PX Display','Space Grotesk',system-ui,sans-serif;font-weight:700;}
.value{font-family:'PX Text','Space Grotesk',system-ui,sans-serif;font-weight:500;fill:#e8e8e8;}
.muted{fill:#7a7a7a;}.text{fill:#e8e8e8;}.accent{fill:#e5383b;}
.scan{animation:scan 6s linear infinite;}
@keyframes scan{0%{transform:translateY(-40px);}100%{transform:translateY(350px);}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite;}
@keyframes pulse{0%{transform:scale(1);opacity:.55;}100%{transform:scale(3.2);opacity:0;}}
.dot{animation:breathe 2.4s ease-in-out infinite;}
@keyframes breathe{0%,100%{opacity:1;}50%{opacity:.6;}}
.cover{animation:type 2.38s steps(34,end) 0.6s both;}
.caret-move{animation:type 2.38s steps(34,end) 0.6s both;}
@keyframes type{from{transform:translateX(0);}to{transform:translateX(367.20px);}}
.caret{animation:blink 1.2s ease-in-out 2.98s infinite;}
@keyframes blink{0%,100%{opacity:.85;}50%{opacity:0;}}
@media (prefers-reduced-motion:reduce){
.scan,.pulse,.dot,.caret{animation:none;}
.pulse,.scan{opacity:0;}
.cover{animation:none;display:none;}
.caret-move{animation:none;transform:translateX(367.20px);}
}</style>
<clipPath id="card"><rect x="0" y="0" width="1000" height="340" rx="14"/></clipPath>
<linearGradient id="scanLine" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#e5383b" stop-opacity="0"/>
<stop offset=".5" stop-color="#e5383b" stop-opacity=".55"/>
<stop offset="1" stop-color="#e5383b" stop-opacity="0"/>
</linearGradient>
<linearGradient id="scanGlow" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#e5383b" stop-opacity="0"/>
<stop offset="1" stop-color="#e5383b" stop-opacity=".06"/>
</linearGradient>
</defs>
<rect x="0" y="0" width="1000" height="340" rx="14" fill="#0a0a0a"/>
<g clip-path="url(#card)">
<text class="mono muted" x="40" y="42" font-size="13">[ profile ]</text>
<text class="mono muted" x="500.0" y="42" font-size="13" text-anchor="middle">github.com/0xPunisher</text>
<text class="mono muted" x="960" y="42" font-size="13" text-anchor="end">online</text>
<circle class="pulse" cx="901.2" cy="37.5" r="3.5" fill="#e5383b"/>
<circle class="dot" cx="901.2" cy="37.5" r="3.5" fill="#e5383b"/>
<line x1="40" y1="66" x2="960" y2="66" stroke="#1f1f1f" stroke-width="1"/>
<text y="156"><tspan class="mono accent" x="36.04" font-size="72.88" font-weight="700">0</tspan><tspan class="mono accent" x="78.19" font-size="72.88" font-weight="700">x</tspan><tspan class="display text" x="120.28" font-size="76" letter-spacing="-1.5">Punisher</tspan></text>
<text class="mono" x="40" y="206" font-size="18" xml:space="preserve"><tspan class="accent">&gt;</tspan><tspan class="text"> building bots that find the edge</tspan></text>
<rect class="cover" x="40" y="188" width="371.20" height="26" fill="#0a0a0a"/>
<g class="caret-move"><rect class="caret" x="42" y="191" width="8.80" height="19" fill="#e8e8e8" opacity=".85"/></g>
<line x1="40" y1="244" x2="960" y2="244" stroke="#1f1f1f" stroke-width="1"/>
<text class="mono muted" x="40.0" y="276" font-size="12">(Role)</text><text class="value" x="40.0" y="304" font-size="18">Builder / Bot developer</text><text class="mono muted" x="370.7" y="276" font-size="12">(Polymarket)</text><text class="value" x="370.7" y="304" font-size="18">Top 0.1% among arbitrage bots</text><line x1="346.7" y1="262" x2="346.7" y2="312" stroke="#1f1f1f" stroke-width="1"/><text class="mono muted" x="677.3" y="276" font-size="12">(Building)</text><text class="value" x="677.3" y="304" font-size="18">Creator of CrawlScan</text><line x1="653.3" y1="262" x2="653.3" y2="312" stroke="#1f1f1f" stroke-width="1"/>
<g class="scan">
<rect x="0" y="-28" width="1000" height="28" fill="url(#scanGlow)"/>
<rect x="0" y="0" width="1000" height="1" fill="url(#scanLine)"/>
</g>
</g>
<rect x=".5" y=".5" width="999" height="339" rx="13.5" fill="none" stroke="#1f1f1f" stroke-width="1"/>
</svg>
